# This is a Databricks asset bundle definition for pipeline_logistica.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: pipeline_logistica
  uuid: f7af9891-ef9d-48cd-b2f4-d189088a758e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c39d31c2-c8c2.cloud.databricks.com
    variables:
      catalog: sandbox
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-c39d31c2-c8c2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gfranco1055@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gfranco1055@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sandbox
      schema: prod
    permissions:
      - user_name: gfranco1055@gmail.com
        level: CAN_MANAGE
